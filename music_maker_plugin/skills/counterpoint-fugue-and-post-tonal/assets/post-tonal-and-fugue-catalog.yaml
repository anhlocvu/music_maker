key_post_tonal_sets:
  tetrahedron_vertex_tetrachords_cohn:
    - {vertex: "A", forte: "4-1", prime: [0, 1, 2, 3], icv: [3, 2, 1, 0, 0, 0], name: "Chromatic cluster"}
    - {vertex: "B/C", forte: "4-9", prime: [0, 1, 6, 7], icv: [2, 0, 0, 0, 2, 2], name: "Double tritone-5th (Bartok/Berg)"}
    - {vertex: "D", forte: "4-6", prime: [0, 1, 2, 7], icv: [2, 1, 0, 0, 2, 1], name: "Vertex D all-combinatorial tetrachord"}
  symmetrical_edge_bc_tetrachords:
    - {forte: "4-25", prime: [0, 2, 6, 8], icv: [0, 2, 0, 2, 0, 2], name: "French Aug-6th symmetrical"}
    - {forte: "4-28", prime: [0, 3, 6, 9], icv: [0, 0, 4, 0, 0, 2], name: "Diminished 7th symmetrical"}
  all_interval_z_tetrachords:
    - {forte: "4-Z15", prime: [0, 1, 4, 6], icv: [1, 1, 1, 1, 1, 1]}
    - {forte: "4-Z29", prime: [0, 1, 3, 7], icv: [1, 1, 1, 1, 1, 1]}
  common_named_sets:
    - {forte: "3-11", prime: [0, 3, 7], icv: [0, 0, 1, 1, 1, 0], name: "Major / Minor triad"}
    - {forte: "4-14", prime: [0, 2, 3, 7], icv: [1, 1, 1, 1, 2, 0], name: "Minor triad add9 (Absil 4-14)"}
    - {forte: "6-35", prime: [0, 2, 4, 6, 8, 10], icv: [0, 6, 0, 6, 0, 3], name: "Whole-tone scale"}

twelve_tone_interval_operators:
  prime_intervals: "ordered ascending differences d_k = (p_{k+1} - p_k) mod 12"
  inversion_intervals: "(12 - d_k) mod 12 (for each k)"
  retrograde_intervals: "reverse of inversion_intervals (12 - d_k reversed)"
  retrograde_inversion_intervals: "reverse of prime_intervals"

