# Counterpoint, Invertible Matrices, Set-Class Enumeration, Spectral & Schillinger Catalog

invertible_counterpoint_matrices:
  octave_15th:
    magic_sum: 9
    interval_map: {1: 8, 2: 7, 3: 6, 4: 5, 5: 4, 6: 3, 7: 2, 8: 1}
    critical_rule: "Treat P5 as dissonance (inverts to P4 above bass)."
  tenth:
    magic_sum: 11
    interval_map: {1: 10, 2: 9, 3: 8, 4: 7, 5: 6, 6: 5, 7: 4, 8: 3, 9: 2, 10: 1}
    critical_rule: "Forbid consecutive 3rds (become 8ves), consecutive 6ths (become 5ths), and similar motion."
  twelfth:
    magic_sum: 13
    interval_map: {1: 12, 2: 11, 3: 10, 4: 9, 5: 8, 6: 7, 7: 6, 8: 5, 9: 4, 10: 3, 11: 2, 12: 1}
    critical_rule: "6ths invert to 7ths: always prepare/resolve 6ths as if 7ths; 3rds invert freely to 10ths."

species_suspensions:
  above_cantus_firmus:
    "7-6": {prep: consonance, susp: 7, res: 6, repeats_allowed: "max 3"}
    "4-3": {prep: consonance, susp: 4, res: 3, repeats_allowed: "max 3"}
    "9-8": {prep: consonance, susp: 9, res: 8, repeats_allowed: "NEVER consecutive (resolves to 8ve)"}
  below_cantus_firmus:
    "2-3": {prep: consonance, susp: 2, res: 3, repeats_allowed: "max 3 (standard cadential below re-do)"}
    "5-6": {prep: consonance, susp: 5, res: 6, repeats_allowed: "max 3"}
    "4-5": {prep: consonance, susp: 4, res: 5, repeats_allowed: "NEVER consecutive (resolves to P5)"}
    "7-8": {avoid: true, reason: "Weak hollow resolution into octave"}

