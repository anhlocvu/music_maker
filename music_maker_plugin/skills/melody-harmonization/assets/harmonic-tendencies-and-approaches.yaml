scale_chord_relationships_pop:
  major_keys:
    diatonic_chords: "Use appropriate modes."
    "II7_and_V7_family":
      "II7": "Mixolydian (all extensions of II7 use this mode too)"
      "II7_II7+_II9+": "Mixolydian of Melodic Minor"
      "II7_II7+_II7b9_II7b9+_(II11b9(+))": "Mixolydian of Harmonic Minor"
      "II7+_II7b5_II7b9+_II7#9+_II7b9b5_II7#9b5": "Locrian Melodic scale"
      "II7_II7b9_II13b9_II7b9b5_II13b9b5_II7#9_II7#9b5_II13#9": "Half-Whole scale"
      "II+_II7b5_II7+_II9+_II9b5": "Whole-Tone scale"
      "II7_II9_II13_II7/6_II7b5_II7#11_II9b5_II#11_II13#11": "Melodic Minor up a 5th (do not think Lydian Melodic)"
      "II7#9(b5)": "Blues scale"
      note: "V7 uses all scales above according to taste and necessity."
    other_secondary_chords:
      "VI7": "Most common 1st choice: Mixolydian Harmonic Minor with added #9th; 2nd: Locrian Melodic; 3rd: Mixolydian"
      "III7_VII7": "Like VI7"
      "I7": "Treat in same manner as V7 (functioning as V7 of IV)"
      "IV7": "Mixolydian; Melodic Minor up a 5th"
      "bVII7": "Melodic Minor up a 5th; Mixolydian"
      "bII7": "Melodic Minor up a 5th"
      "bIII7": "Mixolydian; Melodic Minor up a 5th"
      "bV7": "Treat as bII7 of IV"
      "bVI7": "Melodic Minor up a 5th; Mixolydian"
    qualities:
      major_extended: "Major or Lydian"
      "major+": "Relative Melodic and Harmonic Minor"
      "non_diatonic_m7": "Dorian almost always (except modulation to vi -> Aeolian, or iii -> Phrygian)"
      "m7b5": "Locrian, Dorian of Harmonic Minor, or Aeolian of Melodic Minor"
      "m6": "Melodic Minor or Dorian (depending on melody)"
      "m(maj7)": "Melodic or Harmonic Minor"
      "dim7": "Convert to 7b9 chords with the appropriate scale then being played"
  minor_keys:
    diatonic_chords: "All 5 main scales (Natural, Harmonic, Melodic, Dorian, Phrygian) – use appropriate modes."
    "II7": "Mixolydian of Harmonic Minor, Locrian Melodic, Half-Whole, Mixolydian"
    "bVII7": "Treat as V7 of bIII"
    "IV7": "As in major keys; also when functioning as V7 of bVII, apply V7 scales"
    "bII7_bV7_bVI7": "Same as major keys"
    "bIII7": "Treat as V7 of bVI"
