    - "Any logical bass progression -> C"
    - "D7 -> Db7 -> C (More rare)"
    - "D7 -> Dbmaj7 -> C (More rare)"
    - "Dmaj7 -> Db7 -> C (More rare)"
  combined_turnaround_examples:
    - "A7 -> Dm7 -> G7 -> C"
    - "Am7 -> Dm7 -> G7 -> C"
    - "Em7 -> A7 -> Dm7 -> G7 -> C"
