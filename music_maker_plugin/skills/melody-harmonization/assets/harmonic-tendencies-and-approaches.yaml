pre_destination_approach_movements:
  note: >
    Chords that commonly precede each target chord quality (1977-06-16). Listed roots represent
    whole Chord Families (e.g., D7 - Dbmaj7 - C may become D9 - Dbmaj9 - Cmaj13).
    m7b5 may substitute for m7 anywhere; all °7 & ° built on B, D, F, and Ab are really just G7 sounds.
    Any logical bass progression may also precede Cm7, C7, or C.
  to_minor_destination_Cm7_or_Cm6:
    - "G7 -> Cm7"
    - "Gm7 -> Cm7"
    - "Dm7 -> G7 -> Cm7"
    - "D7 -> G7 -> Cm7"
    - "Ab7 -> G7 -> Cm7"
    - "Db7 -> Cm7"
    - "Abm7 -> Db7 -> Cm7"
    - "Ab7 -> Db7 -> Cm7"
    - "Dbmaj7 -> Cm7"
    - "Abmaj7 -> Dbmaj7 -> Cm7"
    - "Ab7 -> Dbmaj7 -> Cm7"
    - "C#m7 -> Cm7"
    - "Dm7 -> C#m7 -> Cm7 (or Ebm7)"
    - "C7 -> Cm7"
    - "Gm7 -> C7 -> Cm7"
    - "Gb7 (F#7) -> Cm7"
    - "C#m7 -> F#7 -> Cm7"
    - "C#°7 -> Cm7"
    - "C#m7b5 -> Cm7"
    - "Dm7 -> Gm7 -> Cm7"
    - "D7 -> Gm7 -> Cm7"
    - "Ab -> Cm7"
    - "Eb -> Cm7"
    - "Any logical bass progression -> Cm7"
    - "D7 -> Db7 -> Cm7 (More rare)"
    - "D7 -> Dbmaj7 -> Cm7 (More rare)"
    - "Dmaj7 -> Db7 -> Cm7 (More rare)"
  to_dominant_destination_C7:
    - "Gm7 -> C7"
    - "G7 -> C7"
    - "Dm7 -> Gm7 -> C7"
    - "D7 -> Gm7 -> C7"
    - "Dm7 -> G7 -> C7"
    - "D7 -> G7 -> C7"
    - "Ab7 -> G7 -> C7"
    - "Abm7 -> Gm7 -> C7"
    - "Db7 -> C7"
    - "Abm7 -> Db7 -> C7"
    - "F#7 (Gb7) -> C7"
    - "C#m7 -> F#7 -> C7"
    - "Bb -> C7"
    - "Any logical bass progression -> C7"
    - "D7 -> Db7 -> C7 (More rare)"
    - "Dmaj7 -> Db7 -> C7 (More rare)"
  to_major_destination_C:
    - "G7 -> C"
    - "Dm7 -> G7 -> C"
    - "D7 -> G7 -> C"
