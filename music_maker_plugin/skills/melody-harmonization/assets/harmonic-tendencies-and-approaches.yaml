# Ted Greene Harmonic Tendencies, Pre-Destination Chord Movements & Scale-Chord Relationships
# Normalized cleanly from Ted Greene's pedagogical reference sheets (1974-1979):
#   - Most Common Harmonic Tendencies in Jazz and Related Music (1977-10-27 / 1979-09-14)
#   - Summary of Most Common Chord Movements in Modern Jazz Harmony (1977-06-16)
#   - Scale-Chord Relationships in Popular Music (1974-03-23)
#   - Chord Substitution Parts 1-10 (1973)

chord_families_and_top_note_rules:
  note: >
    Chords in the same family are Siblings. 7ths can be reduced to triads or expanded to upper
    extensions (and 6ths likewise). Always check how the top (melody) note sits against extensions.
  major_family:
    members: ["maj", "maj6", "maj7", "add9", "maj9", "maj6/9", "maj13", "maj6/9#11", "maj9#11", "maj/#11", "maj7+", "maj9+"]
    non_dominant_guard: "Fits any major triad NOT functioning as a dominant or dominant of a dominant (V/V, etc.)."
    fitting_major_degrees: ["I", "IV (in major keys)", "bII", "bIII", "bVI", "bVII", "bV (rarer)"]
    special_major_degrees:
      slash9_or_2: ["II", "V", "VI"]
      sus: "all degrees"
      "6_or_6_9": "rarely on other degrees"
      caution: "Altered-5th or #11 major chords are less freely substituted than standard major extensions. Try maj7+, maj9+ for 7+ for an unusual quality."
  minor_family:
    group_1_standard:
      members: ["m", "m7", "m7/11", "m9", "m11", "m/9"]
      role: "Replace any minor triad or minor 7th chord."
    group_2_half_diminished_and_aug:
      members: ["m7b5", "m7b5/11", "m7+ (1,b3,#5,b7)"]
      role: "m7b5 types replace minor 7ths and are most common on ii of minor (vii of major); equivalent to m6 a minor 3rd higher (Am6 = F#m7b5). Try m7+ for 7#9+."
    group_3_minor6:
      members: ["m6", "m6/9", "m6/7", "m6/9/7", "m6/11", "m6/9#11"]
      role: "Used in place of i, iv, bvi (temporary i), or on ii (m6, m6/11); rarer on biii, vi, bvii. Can replace dom7 a 1/2 step lower for altered effect (Am6 for G#7)."
    group_4_line_cliche:
      members: ["m(maj7)", "m(maj9)", "descending/ascending line: m -> m(maj7) -> m7 -> m6"]
      role: "Used in moving-line progressions or when maj7 sits on top as the melody note."
  dominant_7th_family:
    group_1_pretty_natural:
      members: ["7", "7/6", "9", "13"]
      note: "Top melody note determines ear acceptance or rejection."
    group_2_suspended:
      members: ["7sus", "7/6sus", "11", "13sus"]
      note: "Virtually identical to companion m7 a 5th higher (G13sus <-> Dm9). Generally works wherever Group 1 works."
    group_3_whole_tone_and_lydian_dominant:
      whole_tone_type: ["+", "7+", "7b5", "9+"]
      whole_tone_role: "Often replaces V7 or V/V."
      melodic_minor_5th_up_type: ["7b5", "9b5", "7#11", "9#11", "13#11"]
      melodic_minor_degrees:
        I: "ending chords"
        bII: "substitute for V7"
        II: "for II7 (usually major keys)"
        bIII: "occasionally for VI7 (major keys)"
        IV: "for IV7"
        "#IV_or_bV": "for I7"
        V: "rarely for V7"
        bVI: "for II7 and bVI7"
        bVII: "for II7 and bVII7"
    group_4_altered_resolving:
      members: ["7b9", "7#9", "7b9+", "7b9b5", "7#9+", "7#9b5", "13b9", "13#9", "13b9b5"]
      role: "Replaces dominant 7ths functioning as resolving V7."
    group_5_minor_v_and_11b9:
      members: ["11b9", "11b9+", "7/11", "7/6/11"]
      role: "Almost exclusively on V for V7 (rarely I or II)."

