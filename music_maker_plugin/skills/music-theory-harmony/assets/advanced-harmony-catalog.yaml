# Grounded Advanced Harmony, Transformational, Jazz & Film Cadence Catalog

neo_riemannian_operations:
  primary_involutions:
    P: {name: Parallel, common_tones: 2, motion: "3rd shifts +/-1 st", example_C: "C <-> Cm"}
    L: {name: Leading-tone exchange, common_tones: 2, motion: "Major root -1 st / Minor 5th +1 st", example_C: "C <-> Em"}
    R: {name: Relative, common_tones: 2, motion: "Major 5th +2 st / Minor root -2 st", example_C: "C <-> Am"}
  compound_operations:
    S: {name: SLIDE, formula: LPR, common_tones: 1, held_tone: "3rd (e.g. E/Eb)", example_C: "C <-> C#m / Cm <-> B"}
    N: {name: Nebenverwandt, formula: RLP, common_tones: 1, motion: "Major->minor subdominant / Minor->major dominant", example_C: "C <-> Fm / Cm <-> G"}
    H: {name: Hexatonic Pole, formula: PLP, common_tones: 0, voice_leading_semitones: 3, example_C: "C <-> Abm / Cm <-> E", affect: "Cohn uncanny paradox"}
  cyclic_groups:
    PL_hexatonic: {length: 6, scale_family: "014589 hexatonic", subtypes: ["LP from major (Id/bright)", "LP from minor (Tarnhelm/dark)"]}
    RP_octatonic: {length: 8, scale_family: "0134679t octatonic", cadence_fingerprint: "bVII -> V (Subtonic Cowboy Half Cadence)"}
    RL_diatonic_spiral: {length: 24, traversal: "All 24 major & minor triads via 5ths/3rds"}

negative_harmony:
  algebraic_space: "Z12 isomorphic to Z3 x Z4 (Chinese Remainder Theorem)"
  involution_formula: "(2 * tonic_pc + 7 - pc) mod 12"
  C_axis_pairs: [[0,7], [1,6], [2,5], [3,4], [8,11], [9,10]]
  functional_mirrors_in_C:
    "I (C)": "i (Cm)"
    "V7 (G7)": "iiø7 / iv6 (Dm7b5 / Fm6)"
    "ii7 (Dm7)": "v7 / bVII6 (Gm7 / Bb6)"
    "IVmaj7 (Fmaj7)": "bIIImaj7 / Gm(b6) (Ebmaj7)"
    "vi7 (Am7)": "i7 (Cm7)"

bartok_lendvai_axis_system:
  axes_in_C:
    T_tonic: [C, Eb, F#, A]
    S_subdominant: [F, Ab, B, D]
    D_dominant: [G, Bb, Db, E]
  progression_dynamics:
    normal_progression: "T -> S -> D -> T (releases tension)"
    retrogression: "T -> D -> S -> T (builds tension)"
    pole_counterpole: "Tritone switch within axis e.g. C<->F#, G<->Db (neutral tension)"

film_cadence_taxonomy:
  categories:
    mixed_plagal_cadence: {formula: "IV -> iv / iiø7 -> I", voice_leading: "6 -> b6 -> 5", affect: "Wistful/romantic finality"}
    subtonic_half_cadence: {formula: "bVII -> V", nrt: "RP (from V/flat side)", affect: "Pastoral/heroic openness"}
    subtonic_authentic_cadence: {formula: "bVII -> I (or bVII -> IV -> I)", affect: "Warm modal anthem closure"}
  cmcr_types_lehman_mto:
    Type_0: {shift_semitones: 0, example: "A -> Bb (Jurassic Park)", affect: "Key-preserving chromatic tonic return"}
    Type_I: {shift_semitones_from_old_I: 4, resolution: "III (V -> down m3)", example: "Harry Potter (D -> B from implied G)", affect: "Radiant wonderment / expansive lift"}
    Type_III: {shift_semitones_from_old_I: -1, resolution: "VII", example: "E.T. (D -> C#) & Jurassic Park (F# -> Bb)", affect: "Instantaneous otherworldly revelation"}
    Type_IV: {shift_semitones_from_old_I: -3, resolution: "VI", example: "Jurassic Park (C -> D from implied F; plagal Ab -> C from Eb)", affect: "Triumphant awe & heroic arrival"}
    Type_VI: {shift_semitones_from_old_I: 6, resolution: "#IV", affect: "Relaxational tritone displacement (rare)"}

